# Example MeterLogger configuration.
#
# Copy this file and edit it for your setup:
#   cp config.example.yaml config.yaml
#
# Then point meterlogger at it:
#   meterlogger --config ./config.yaml --source grid
#
# Every field can also be set via environment variable (dots become
# underscores, e.g. Grid.SerialInterface -> GRID_SERIALINTERFACE) or, for the
# handful of flag-backed fields, via CLI flags. See documentation/configuration.md
# for the full field reference, defaults, and precedence order.
#
# Only Grid + QuestDB are enabled below as a minimal working example. Enable
# and fill in the other sources/sinks you actually use; leave the rest as-is.

# Enable debug-level logging.
Debug: false

# How often to flush buffered data to the sinks.
FlushInterval: 10s

# ── HTTP health / metrics server ────────────────────────────
HTTPServer:
  Port: 8080
  LivenessFailureThreshold: 90s

# ── QuestDB sink ─────────────────────────────────────────────
QuestDB:
  Enabled: true
  Host: questdb
  Port: 9009
  User: admin
  Password: quest

# ── Stdout sink (debug) ──────────────────────────────────────
# Logs readings instead of persisting them. Not for production.
Stdout:
  Enabled: false

# ── PostgreSQL sink ──────────────────────────────────────────
# Tables are created/migrated automatically on startup.
Postgres:
  Enabled: false
  Host: localhost
  Port: 5432
  User: meterlogger
  Password: secret
  Database: meterlogger
  SSLMode: disable # disable | require | verify-full

# ── MySQL sink ───────────────────────────────────────────────
# Tables are created/migrated automatically on startup.
MySQL:
  Enabled: false
  Host: localhost
  Port: 3306
  User: meterlogger
  Password: secret
  Database: meterlogger

# ── TimescaleDB sink ─────────────────────────────────────────
# PostgreSQL-compatible; uses the same schema as Postgres.
TimescaleDB:
  Enabled: false
  Host: localhost
  Port: 5432
  User: meterlogger
  Password: secret
  Database: meterlogger
  SSLMode: disable # disable | require | verify-full

# ── ClickHouse sink ───────────────────────────────────────────
ClickHouse:
  Enabled: false
  Host: localhost
  Port: 9000
  User: default
  Password: ""
  Database: meterlogger

# ── TDEngine sink ─────────────────────────────────────────────
TDEngine:
  Enabled: false
  Host: localhost
  Port: 6041
  User: root
  Password: taosdata
  Database: meterlogger

# ── OpenTelemetry tracing ──────────────────────────────────
OTEL:
  Enabled: false
  CollectorAddr: "otel-collector:4317" # gRPC, no TLS
  ServiceName: "meterlogger-grid"

# ── Continuous profiling (Grafana Pyroscope) ────────────────
Profiling:
  Enabled: false
  ServerAddr: "http://pyroscope:4040"
  ServiceName: "meterlogger-grid"
  BasicAuthUser: ""
  BasicAuthPassword: ""

# ── Heat meter (M-Bus or optical over serial) ──────────────
Heat:
  Enabled: false
  Measurement: heat_meter
  SerialInterface: /dev/ttyUSB0
  # Reader selects the protocol:
  #   mbus       - M-Bus level converter (default)
  #   optical    - IR eye on KMP Multicals (402, 403, 601, 602, 603, 801, 803)
  #   optical401 - IR eye on Multical 401 and 66C
  Reader: mbus
  MbusAddress: 1 # M-Bus device address (1-250), mbus reader only
  ScrapeInterval: 30s
  # Optical401 scaling depends on the meter's configuration code; verify one
  # reading against the meter LCD. These are the common NL district heating
  # defaults.
  # Optical401:
  #   EnergyUnit: GJ       # GJ, kWh, or MWh
  #   EnergyDecimals: 3
  #   VolumeDecimals: 3
  #   PowerDecimals: 1
  #   FlowDecimals: 1

# ── Grid meter (DSMR P1 or SML over serial) ────────────────
Grid:
  Enabled: true
  Measurement: grid_meter
  # Reader selects the protocol:
  #   dsmr - Dutch/Belgian DSMR P1 meter over a USB-to-P1 cable (default)
  #   sml  - German SML meter (EMH eHZ/mMe4.0, ISKRA MT681, EasyMeter
  #          Q3A/Q3B, eBZ DD3 SM, Holley DTZ541) via IR read head, 9600 8N1.
  #          Factory-state meters send only the energy total until the meter
  #          PIN is entered and the extended info mode is enabled.
  Reader: dsmr
  SerialInterface: /dev/ttyUSB0
  # No ScrapeInterval: the meter pushes data every second
  # (every 10 seconds on Luxembourg Smarty meters)

  # Only for encrypted meters (Luxembourg Smarty, Austrian Sagemcom T210-D):
  # the 32-hex-char decryption key from your grid operator. Leave unset for
  # plaintext meters (NL, BE).
  # DecryptionKey: "00000000000000000000000000000000"
  # AuthenticationKey defaults to the fixed Luxembourg AK; Austrian users
  # override it with their GAK when their operator uses one.
  # AuthenticationKey: "00112233445566778899AABBCCDDEEFF"  # gitleaks:allow public spec constant

  # Gas meter readings from the same P1 port. The gas meter is attached to
  # the electricity meter over M-Bus; its readings arrive inside the P1
  # telegrams. Gas requires the grid source: same process, same serial port.
  # There is no separate gas source.
  #
  # The gas value updates every 5 minutes (DSMR 5) or hourly (DSMR 4 and
  # older). Rows are stored only when the meter reports a new capture, not
  # for every telegram.
  Gas:
    Enabled: false
    Measurement: gas_meter # table name in all enabled sinks (default)

  # Water meter readings from the same P1 port, exactly like gas. Common in
  # Belgium, where Fluvius links the water meter to the digital electricity
  # meter. Covers cold (device type 7) and warm (device type 6) water meters.
  # Water:
  #   Enabled: false
  #   Measurement: water_meter # table name in all enabled sinks (default)

  # Heat and cooling (district heating) meter readings from the same P1
  # port, exactly like gas. Rare in practice. Covers device types 4 (heat),
  # 10/11 (cooling) and 12 (heat/cool combined); readings must be in GJ.
  # Thermal:
  #   Enabled: false
  #   Measurement: thermal_meter # table name in all enabled sinks (default)

# ── Solar (Enphase Envoy HTTP API) ─────────────────────────
Enphase:
  Enabled: false
  Measurement: solar
  EnvoyURL: https://192.168.1.100
  User: owner@example.com
  Password: secret
  Serial: 122140012345 # Envoy gateway serial number
  ScrapeInterval: 5m

# ── Ventilation (DucoBox HTTP API) ─────────────────────────
Ventilation:
  Enabled: false
  MeasurementBaseName: ventilation
  ScrapeInterval: 1m
  HostURL: http://192.168.1.200:8080
  Nodes:
    - 1
    - 2
    - 3
